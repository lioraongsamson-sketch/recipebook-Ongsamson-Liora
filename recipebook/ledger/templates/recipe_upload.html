{% extends 'base.html' %}

{% block content %}

    <h2>Upload Image for {{ recipe.title }}</h2>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form }}
        <input type="submit" name="submit" value="Save Form">
    </form>
    <br>
    <a href="{{ recipe.get_absolute_url }}">Go Back</a>
{% endblock %}
