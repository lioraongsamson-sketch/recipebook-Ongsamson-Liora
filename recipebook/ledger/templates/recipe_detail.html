{% extends 'base.html' %}

{% block content %}
    <h3>{{ name }}</h3>
    <h6>Author: {{ recipe.author.name }}</h6>
    <h2>Ingredients</h2>

    <ul>
        {% for ingredient in recipe.ingredients.all %}
        <li>{{ ingredient.ingredient.name }}, {{ ingredient.quantity }}</li>
        {% endfor %}
    </ul>
{% endblock %}
